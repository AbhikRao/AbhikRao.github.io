  const N = 5000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);

    const r = 6 + Math.random() * 60, a = Math.random() * Math.PI * 2;
    pos.set([Math.cos(a) * r, (Math.random() - 0.5) * 60, 30 - Math.random() * 190], i * 3);
    const c = colA.clone().lerp(colB, Math.random()).lerp(new THREE.Color(1, 1, 1), 0.5);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending }));
  stars.name = 'stars';
  scene.add(stars);
}

/* ---------- floating debris shapes ---------- */
const debris = [];
{
  const geos = [new THREE.OctahedronGeometry(0.5), new THREE.TetrahedronGeometry(0.55), new THREE.IcosahedronGeometry(0.45), new THREE.BoxGeometry(0.6, 0.6, 0.6)];
  for (let i = 0; i < 70; i++) {
    const m = new THREE.Mesh(geos[i % 4], new THREE.MeshBasicMaterial({ color: colA.clone().lerp(colB, Math.random()), wireframe: true, transparent: true, opacity: 0.55 }));
    const a = Math.random() * Math.PI * 2, r = 7 + Math.random() * 14;
    m.position.set(Math.cos(a) * r, (Math.random() - 0.5) * 18, 8 - Math.random() * 110);
    m.scale.setScalar(0.6 + Math.random() * 1.8);
    m.userData = { s: new THREE.Vector3(Math.random(), Math.random(), Math.random()).multiplyScalar(0.5), y: m.position.y, p: Math.random() * 6 };
    debris.push(m); scene.add(m);
  }
}

/* ---------- 1. HERO: living shader orb ---------- */
const uniforms = { uTime: { value: 0 }, uFade: { value: 1 }, uA: { value: colA }, uB: { value: colB }, uMouse: { value: new THREE.Vector2() } };
const orbMat = (wire) => new THREE.ShaderMaterial({
  uniforms, wireframe: wire, transparent: true,
  vertexShader: `
    uniform float uTime; uniform vec2 uMouse; varying vec3 vN; varying vec3 vV;
    void main(){
      float n = sin(position.x*1.7+uTime)*sin(position.y*1.9+uTime*1.1)*sin(position.z*1.6+uTime*.9);
      float m = 1.0 + .35*dot(normalize(position.xy+1e-4), uMouse) ;
      vec3 p = position + normal*(n*.5*m);
      vec4 mv = modelViewMatrix*vec4(p,1.);
      vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: `
    uniform float uTime; uniform float uFade; uniform vec3 uA; uniform vec3 uB; varying vec3 vN; varying vec3 vV;
    void main(){
      float f = pow(1.-max(dot(normalize(vN),normalize(vV)),0.), 2.2);
      vec3 c = mix(uA,uB,clamp(f+.25*sin(uTime*.7+vN.y*2.),0.,1.));
      gl_FragColor = vec4(c*(${wire ? '.35' : '.08'}+f*${wire ? '.6' : '.8'}), (${wire ? '0.5' : '0.9'})*uFade);
    }`
});
const hero = new THREE.Group();
hero.add(new THREE.Mesh(new THREE.IcosahedronGeometry(2.4, 10), orbMat(false)));
hero.add(new THREE.Mesh(new THREE.IcosahedronGeometry(2.42, 5), orbMat(true)));
hero.position.set(3.2, 0, 0);
scene.add(hero);

/* ---------- 2. ABOUT: torus knot ---------- */
const about = new THREE.Group();
about.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1.8, 0.45, 220, 24, 2, 3), new THREE.MeshStandardMaterial({ color: 0x1a0c0e, metalness: 0.9, roughness: 0.25 })));
about.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1.82, 0.47, 120, 12, 2, 3), new THREE.MeshBasicMaterial({ color: colB, wireframe: true, transparent: true, opacity: 0.45 })));
about.position.set(3.5, 0, -16);
scene.add(about);

/* ---------- 3. SKILLS: orbiting label ring ---------- */
const skills = new THREE.Group();
skills.position.set(-3.5, 0, -36);
skills.rotation.x = 0.35;
scene.add(skills);
const skillLabels = [];
{
  const core = new THREE.Mesh(new THREE.SphereGeometry(1.1, 48, 48), new THREE.MeshStandardMaterial({ color: 0x000000, emissive: colA, emissiveIntensity: 1.6 }));
  skills.add(core);
  skills.add(new THREE.Mesh(new THREE.TorusGeometry(6.4, 0.015, 8, 160), new THREE.MeshBasicMaterial({ color: colA, transparent: true, opacity: 0.6 })));
  skills.add(new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.012, 8, 160), new THREE.MeshBasicMaterial({ color: colB, transparent: true, opacity: 0.5 })));
  CONFIG.skills.forEach((name, i) => {
    const c = document.createElement('canvas'); c.width = 512; c.height = 128;
    const x = c.getContext('2d');
    x.font = '600 56px "Space Grotesk", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    const w = x.measureText(name).width + 70;
    x.fillStyle = 'rgba(24,10,12,.88)'; x.strokeStyle = i % 2 ? '#' + colB.getHexString() : '#' + colA.getHexString(); x.lineWidth = 4;
    x.beginPath(); x.roundRect(256 - w / 2, 14, w, 100, 50); x.fill(); x.stroke();
    x.fillStyle = '#fff'; x.fillText(name, 256, 66);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    sp.scale.set(3.2, 0.8, 1);
    const a = (i / CONFIG.skills.length) * Math.PI * 2, r = i % 2 ? 4.2 : 6.4;
    sp.userData = { a, r, sp: (i % 2 ? -1 : 1) * (0.12 + (i % 3) * 0.03) };
    skills.add(sp); skillLabels.push(sp);
  });
}

/* ---------- 4. PROJECTS: a planetary system you fly through ---------- */
const SYS_CENTER = new THREE.Vector3(0, 0, -62);
const system = new THREE.Group();
system.position.copy(SYS_CENTER);
system.rotation.x = 0.38;
scene.add(system);
const planets = [];
const planetMeshes = [];
let focus = -1, lastFocus = 0, focusBlend = 0;
{
  // sun
  const sun = new THREE.Mesh(new THREE.SphereGeometry(1.7, 48, 48), new THREE.MeshBasicMaterial({ color: colA.clone().lerp(new THREE.Color(1, 1, 1), 0.5) }));
  system.add(sun);
  const gc = document.createElement('canvas'); gc.width = gc.height = 256;
  const gx = gc.getContext('2d'), gg = gx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gg.addColorStop(0, 'rgba(255,255,255,.95)'); gg.addColorStop(0.25, '#' + colA.getHexString() + 'aa'); gg.addColorStop(1, 'rgba(0,0,0,0)');
  gx.fillStyle = gg; gx.fillRect(0, 0, 256, 256);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(gc), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  glow.scale.set(11, 11, 1); system.add(glow);

  const vert = `
    varying vec3 vP; varying vec3 vWN; varying vec3 vWP; varying vec3 vV;
    void main(){ vP = position; vWN = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position, 1.); vWP = wp.xyz; vV = cameraPosition - wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp; }`;
  const frag = `
    uniform vec3 c1, c2, rim, lightPos; uniform float seed, hover, bands, fade;
    varying vec3 vP; varying vec3 vWN; varying vec3 vWP; varying vec3 vV;
    float h(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float n3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
      return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z); }
    float fbm(vec3 p){ float a = .5, s = 0.; for(int i = 0; i < 4; i++){ s += a * n3(p); p *= 2.03; a *= .5; } return s; }
    void main(){
      vec3 p = normalize(vP);
      float b = fbm(vec3(p.x * 2., p.y * bands + fbm(p * 3. + seed) * 1.6, p.z * 2.) + seed);
      vec3 col = mix(c1, c2, smoothstep(.25, .75, b));
      vec3 N = normalize(vWN), L = normalize(lightPos - vWP);
      float d = max(dot(N, L), 0.);
      float f = pow(1. - max(dot(N, normalize(vV)), 0.), 2.5);
      vec3 c = col * (.16 + d * 1.05) + rim * f * (.55 + hover * 1.3) + col * hover * .3;
      gl_FragColor = vec4(c, fade);
    }`;

  const makeLabel = (text, featured) => {
    const c = document.createElement('canvas'); c.width = 640; c.height = 112;
    const x = c.getContext('2d');
    x.font = '700 54px "Space Grotesk", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.shadowColor = 'rgba(10,6,7,.95)'; x.shadowBlur = 14;
    x.fillStyle = featured ? '#ffd36b' : '#ffffff';
    x.fillText((featured ? '★ ' : '') + text, 320, 56);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, depthTest: false }));
    sp.scale.set(6.6, 1.155, 1); sp.renderOrder = 10;
    return sp;
  };

  const ORBIT = { hackathon: { R: 8.5, speed: 0.055, base: 8 }, project: { R: 15.5, speed: -0.035, base: 322 } };
  ['hackathon', 'project'].forEach((row) => {
    const o = ORBIT[row];
    const orbitLine = new THREE.Mesh(new THREE.TorusGeometry(o.R, 0.025, 8, 220), new THREE.MeshBasicMaterial({ color: row === 'hackathon' ? colA : colB, transparent: true, opacity: 0.35 }));
    orbitLine.rotation.x = Math.PI / 2; system.add(orbitLine);
    const list = CONFIG.projects.filter((p) => p.row === row);
    list.forEach((p, i) => {
      const featured = i < CONFIG.featuredPerRow;
      const hue = (o.base + i * 9) % 360;
      const r = featured ? 1.55 : 0.95 - Math.min(i, 7) * 0.02;
      const col = (hh, ss, ll) => new THREE.Color(`hsl(${hh},${ss}%,${ll}%)`);
      const mat = new THREE.ShaderMaterial({
        vertexShader: vert, fragmentShader: frag, transparent: true,
        uniforms: {
          c1: { value: col(hue, 80, 58) }, c2: { value: col((hue + 28) % 360, 75, 26) },
          rim: { value: featured ? new THREE.Color('#ffd36b') : col(hue, 100, 70) },
          lightPos: { value: SYS_CENTER }, seed: { value: i * 7.3 + (row === 'project' ? 40 : 0) },
          hover: { value: 0 }, fade: { value: 1 }, bands: { value: 2.5 + (i % 4) * 1.5 }
        }
      });
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 48), mat);
      mesh.position.x = o.R;
      if (featured) {
        const halo = new THREE.Mesh(new THREE.RingGeometry(r * 1.45, r * 1.85, 96), new THREE.MeshBasicMaterial({ color: 0xffd36b, side: THREE.DoubleSide, transparent: true, opacity: 0.75 }));
        halo.rotation.x = Math.PI / 2.3; mesh.add(halo);
      }
      const label = makeLabel(p.title, featured);
      label.position.set(0, -(r + 1.05), 0); mesh.add(label);
      const pivot = new THREE.Group();
      const a0 = (i / list.length) * Math.PI * 2 + (row === 'project' ? 0.6 : 0);
      pivot.add(mesh); system.add(pivot);
      mesh.userData.idx = planets.length;
      planets.push({ mesh, pivot, mat, label, project: p, row, featured, r, a0, speed: o.speed, hover: 0 });
      planetMeshes.push(mesh);
    });
  });
}

/* ---------- 5. CONTACT: particle globe ---------- */
const contact = new THREE.Group();
contact.position.set(0, 0, -96);
scene.add(contact);
{
  const N = 3500, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, r = 3.6 + Math.random() * 0.15, s = Math.sqrt(1 - u * u);
    pos.set([r * s * Math.cos(t), r * u, r * s * Math.sin(t)], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  contact.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.06, color: colA, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })));
  const ring = new THREE.Mesh(new THREE.TorusGeometry(5.2, 0.03, 12, 200), new THREE.MeshBasicMaterial({ color: colB }));
  ring.rotation.x = 1.2; contact.add(ring);
  const ring2 = ring.clone(); ring2.rotation.set(0.4, 0.6, 0); ring2.scale.setScalar(1.2); ring2.material = new THREE.MeshBasicMaterial({ color: colA, transparent: true, opacity: 0.6 }); contact.add(ring2);
}

/* ---------- camera path (one keyframe per section) ---------- */
const camPts = [
  [0, 0, 10],        // hero
  [-2.5, 1, -8],     // about
  [4, 3.5, -25],     // skills
  [0, 11, -37],      // projects (above the orbital plane)
  [10, 6, -88]       // contact
].map((p) => new THREE.Vector3(...p));
const lookPts = [
  [1.5, 0, 0],
  [3.5, 0, -16],
  [-3.5, 0, -36],
  [0, 0, -62],
  [0, 0, -96]
].map((p) => new THREE.Vector3(...p));
const camCurve = new THREE.CatmullRomCurve3(camPts, false, 'centripetal');
const lookCurve = new THREE.CatmullRomCurve3(lookPts, false, 'centripetal');

/* ---------- fit the whole planetary system on screen, at any window size ---------- */
function fitSystem() {
  const th = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), tw = th * camera.aspect;
  const D = Math.max(Math.max(19.5 / tw, 17.5 / th) * 1.2, 30), elev = 0.62;
  camPts[3].set(0, Math.sin(elev) * D, SYS_CENTER.z + Math.cos(elev) * D);
}

/* ---------- focus fade: scenes outside the current section recede ---------- */
const FADE_FLOOR = 0.14;
const fadeSets = [hero, about, skills, system, contact].map((g) => {
  const items = [];
  g.traverse((o) => {
    if (!o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
      if (m.isShaderMaterial) items.push({ m });
      else { m.transparent = true; items.push({ m, base: m.opacity }); }
    });
  });
  return items;
});
function applyFade(sTime) {
  fadeSets.forEach((items, i) => {
    const x = Math.max(0, 1 - Math.abs(sTime - i / (fadeSets.length - 1)) / 0.2);
    const w = FADE_FLOOR + (1 - FADE_FLOOR) * x * x * (3 - 2 * x);
    items.forEach(({ m, base }) => {
      if (m.isShaderMaterial) { if (m.uniforms.fade) m.uniforms.fade.value = w; if (m.uniforms.uFade) m.uniforms.uFade.value = w; }
      else m.opacity = base * w;
    });
  });
}

/* ---------- input ---------- */
const mouse = new THREE.Vector2(), mouseS = new THREE.Vector2();
addEventListener('pointermove', (e) => {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});
let scrollT = 0, scrollS = 0;
const progressBar = $('#progress');
const onScroll = () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  scrollT = max > 0 ? scrollY / max : 0;
  progressBar.style.width = scrollT * 100 + '%';
  if (focus >= 0 && Math.abs(scrollT - 0.75) > 0.08) setFocus(-1);
};
addEventListener('scroll', onScroll, { passive: true }); onScroll();

const ray = new THREE.Raycaster();
let hovered = null, hintDone = false;
const hint = $('#hint');
const detail = $('#detail');
function renderDetail(i) {
  const P = planets[i], p = P.project;
  detail.replaceChildren(
    el('div', { className: 'eyebrow', textContent: [P.featured ? '★ Featured' : '', p.event, p.badge].filter(Boolean).join(' · ') }),
    el('h3', { textContent: p.title }),
    el('p', { textContent: p.detail || p.desc }),
    el('div', { className: 'chips' }, p.tags.map((t) => el('span', { className: 'chip', textContent: t }))),
    el('div', { className: 'row' },
      p.link ? el('a', { className: 'btn primary', href: p.link, target: '_blank', rel: 'noopener', textContent: 'View project' }) : '',
      el('button', { className: 'btn', textContent: '←', ariaLabel: 'Previous', onclick: () => setFocus((focus + planets.length - 1) % planets.length) }),
      el('button', { className: 'btn', textContent: '→', ariaLabel: 'Next', onclick: () => setFocus((focus + 1) % planets.length) }),
      el('button', { className: 'btn', textContent: 'Back', onclick: () => setFocus(-1) }))
  );
}
function setFocus(i) {
  if (focus >= 0) lastFocus = focus;
  focus = i;
  if (i >= 0) { lastFocus = i; renderDetail(i); hintDone = true; }
  detail.classList.toggle('open', i >= 0);
  document.body.classList.toggle('focusing', i >= 0);
}
addEventListener('keydown', (e) => {
  if (focus < 0) return;
  if (e.key === 'Escape') setFocus(-1);
  if (e.key === 'ArrowRight') setFocus((focus + 1) % planets.length);
  if (e.key === 'ArrowLeft') setFocus((focus + planets.length - 1) % planets.length);
});
// canvas sits under <main>, so listen on window for clicks that land on empty page space
addEventListener('click', (e) => {
  if (e.target.closest('#detail, nav, .btn, .chip, a, .panel')) return;
  if (hovered) setFocus(hovered.userData.idx);
  else if (focus >= 0) setFocus(-1);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 85 : 60; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  placeHero();
  fitSystem();
  onScroll();
});
function placeHero() { const narrow = innerWidth < 800; hero.position.set(narrow ? 0 : 3.2, narrow ? -1.5 : 0, narrow ? -7 : 0); }
placeHero();
camera.fov = camera.aspect < 1 ? 85 : 60; camera.updateProjectionMatrix();
fitSystem();

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const look = new THREE.Vector3(), camPos = new THREE.Vector3();
const tmpP = new THREE.Vector3(), tmpO = new THREE.Vector3(), tmpR = new THREE.Vector3(), fPos = new THREE.Vector3(), fLook = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
let orbitT = 0, orbitFactor = 1;
const dots = [...nav.children];
let activeIdx = -1;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.5), t = clock.elapsedTime;
  scrollS += (scrollT - scrollS) * (1 - Math.pow(0.001, dt));
  mouseS.lerp(mouse, 1 - Math.pow(0.01, dt));

  // camera along the path + mouse parallax
  camCurve.getPoint(scrollS, camPos);
  lookCurve.getPoint(scrollS, look);
  const inProjects = Math.max(0, 1 - Math.abs(scrollS - 0.75) * 5);
  focusBlend += ((focus >= 0 ? 1 : 0) - focusBlend) * (1 - Math.pow(0.003, dt));
  if (focusBlend > 0.001) {
    const P = planets[lastFocus];
    P.mesh.getWorldPosition(tmpP);
    tmpO.copy(tmpP).sub(SYS_CENTER); tmpO.y *= 0.3; tmpO.normalize();
    fPos.copy(tmpP).addScaledVector(tmpO, P.r * 3.4 + 3.2); fPos.y += P.r * 0.7;
    if (innerWidth < 800) { fLook.copy(tmpP); fLook.y -= P.r * 1.3; }
    else { tmpR.crossVectors(tmpO.clone().negate(), UP); fLook.copy(tmpP).addScaledVector(tmpR, P.r * 1.8); }
    camPos.lerp(fPos, focusBlend); look.lerp(fLook, focusBlend);
  }
  const mk = 1 - focusBlend;
  camera.position.copy(camPos);
  camera.position.x += mouseS.x * 0.6 * mk;
  camera.position.y += mouseS.y * 0.4 * mk;
  look.x += mouseS.x * (1.5 + inProjects * 2) * mk;
  look.y += mouseS.y * 0.8 * mk;
  camera.lookAt(look);

  // animate world
  uniforms.uTime.value = t;
  uniforms.uMouse.value.set(mouseS.x, mouseS.y);
  hero.rotation.y = t * 0.15; hero.rotation.x = t * 0.07;
  about.rotation.x = t * 0.2; about.rotation.y = t * 0.3;
  skills.rotation.y = t * 0.1;
  skillLabels.forEach((s) => {
    const a = s.userData.a + t * s.userData.sp;
    s.position.set(Math.cos(a) * s.userData.r, Math.sin(a * 2) * 0.4, Math.sin(a) * s.userData.r);
  });
  contact.rotation.y = t * 0.12; contact.rotation.z = Math.sin(t * 0.3) * 0.1;
  debris.forEach((d) => {
    d.rotation.x += d.userData.s.x * dt; d.rotation.y += d.userData.s.y * dt;
    d.position.y = d.userData.y + Math.sin(t * 0.5 + d.userData.p) * 0.8;
  });
  scene.getObjectByName('stars').rotation.z = t * 0.01;

  // planets: orbit, spin, hover
  ray.setFromCamera(mouse, camera);
  const hit = inProjects > 0.3 ? ray.intersectObjects(planetMeshes)[0] : null;
  hovered = hit ? hit.object : null;
  document.body.style.cursor = hovered ? 'pointer' : '';
  orbitFactor += ((focus >= 0 ? 0 : hovered ? 0.2 : 1) - orbitFactor) * (1 - Math.pow(0.01, dt));
  orbitT += dt * orbitFactor;
  planets.forEach((P) => {
    P.pivot.rotation.y = P.a0 + P.speed * orbitT;
    P.mesh.rotation.y += dt * 0.25;
    P.hover += (((P.mesh === hovered || planets.indexOf(P) === focus) ? 1 : 0) - P.hover) * (1 - Math.pow(0.001, dt));
    P.mat.uniforms.hover.value = P.hover;
    P.label.visible = planets.indexOf(P) !== focus;
    P.mesh.scale.setScalar(1 + P.hover * 0.15);
  });

  applyFade(scrollS);

  // nav state
  const idx = Math.round(scrollS * (sections.length - 1));
  hint.classList.toggle('show', idx === 3 && focus < 0 && !hintDone && scrollS > 0.68);
  if (idx !== activeIdx) { activeIdx = idx; dots.forEach((d, i) => d.classList.toggle('on', i === idx)); }

  composer.render();
  requestAnimationFrame(frame);
}
frame();
document.fonts.ready.then(() => setTimeout(() => $('#loader').classList.add('done'), 300));
setTimeout(() => $('#loader').classList.add('done'), 3000);
</script>
